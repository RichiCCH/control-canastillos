name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: inventariorolonapp
  NODE_VERSION: '20.x'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo '{"name":"app","version":"1.0.0","scripts":{"start":"node server.js"}}' > .next/standalone/package.json
          cd .next/standalone && zip -qq -r ../../app.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_045D2BA2149E4FC89D987F60A290BDD8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_951CEB9D9384497D80207E5CCB392EDB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_59A6DABC242940EAB20CA88C6CC7B617 }}

      - name: Configure and deploy
        run: |
          # Limpiar archivos viejos de Oryx
          az webapp ssh --resource-group approlon --name ${{ env.AZURE_WEBAPP_NAME }} \
            --command "rm -f /home/site/wwwroot/oryx-manifest.toml /home/site/wwwroot/node_modules.tar.gz" || true

          # Configurar startup command
          az webapp config set \
            --resource-group approlon \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --startup-file "node server.js"

          # Deploy del zip
          az webapp deploy \
            --resource-group approlon \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src-path app.zip \
            --type zip \
            --clean true \
            --restart true
