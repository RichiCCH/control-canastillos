name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: inventariorolonapp
  NODE_VERSION: '20.x'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build
          echo "=== Estructura .next/standalone ==="
          ls -la .next/standalone/
          ls -la .next/standalone/.next/ || echo "NO HAY .next en standalone"
          echo "=== CSS hash ==="
          ls .next/static/css/
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo '{"name":"app","version":"1.0.0","scripts":{"start":"node server.js"}}' > .next/standalone/package.json
          echo "=== Despues de copiar ==="
          ls .next/standalone/.next/static/css/
          cd .next/standalone && zip -qq -r ../../app.zip .
          echo "=== Tamaño del zip ==="
          ls -lh ../../app.zip || ls -lh ../../../app.zip || ls -lh app.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_045D2BA2149E4FC89D987F60A290BDD8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_951CEB9D9384497D80207E5CCB392EDB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_59A6DABC242940EAB20CA88C6CC7B617 }}

      - name: Configure and deploy
        run: |
          # Configurar startup command
          az webapp config set \
            --resource-group approlon \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --startup-file "node server.js"

          # Detener app, limpiar wwwroot completamente, desplegar, reiniciar
          az webapp stop --resource-group approlon --name ${{ env.AZURE_WEBAPP_NAME }} || true

          # Limpiar wwwroot via Kudu REST API
          KUDU_URL="https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net"
          TOKEN=$(az account get-access-token --resource "https://management.azure.com" --query accessToken -o tsv)
          curl -s -X DELETE "$KUDU_URL/api/vfs/site/wwwroot/?recursive=true" \
            -H "Authorization: Bearer $TOKEN" || true

          # Deploy del zip limpio
          az webapp deploy \
            --resource-group approlon \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src-path app.zip \
            --type zip \
            --clean true

          # Reiniciar
          az webapp start --resource-group approlon --name ${{ env.AZURE_WEBAPP_NAME }}
