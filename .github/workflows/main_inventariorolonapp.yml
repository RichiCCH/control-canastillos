name: Build and deploy Node.js app to Azure Web App - inventariorolonapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          echo '{"name":"app","version":"1.0.0","scripts":{"start":"node server.js"}}' > .next/standalone/package.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0735B2944BEC477E952BCC979A7A49C6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_46EC3174F89D4D14829C7A7B9A0FF2FA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7B5CD38B6CEA440A9C84C1379E2DCECC }}

      - name: Set startup command
        run: |
          az webapp config set \
            --resource-group approlon \
            --name inventariorolonapp \
            --startup-file "node server.js"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'inventariorolonapp'
          slot-name: 'Production'
          package: .
          clean: true
